name: FreeLife RP - GTA SA Android Mod

on:
  workflow_dispatch:
  push:
    paths:
      - "GTASA_RP_Mod/**"
      - ".github/workflows/gtasa-rp-mod.yml"

permissions:
  contents: read

jobs:
  build-mod:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FreeLife RP
        uses: actions/checkout@v4
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android NDK
        run: sdkmanager "ndk;27.2.12479018"
      - name: Fetch AML Plugin SDK
        run: git clone --depth 1 https://github.com/AndroidModLoader/aml-psdk.git vendor/aml-psdk
      - name: Place FreeLife RP source in SDK example tree
        run: |
          mkdir -p vendor/aml-psdk/examples/game_sa/freelife_rp
          cp GTASA_RP_Mod/main.cpp GTASA_RP_Mod/Android.mk vendor/aml-psdk/examples/game_sa/freelife_rp/
      - name: Build ARM32 and ARM64 plugins
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: |
          "${ANDROID_NDK_HOME}/ndk-build" \
            NDK_PROJECT_PATH="$GITHUB_WORKSPACE/vendor/aml-psdk" \
            APP_BUILD_SCRIPT="$GITHUB_WORKSPACE/vendor/aml-psdk/examples/game_sa/freelife_rp/Android.mk" \
            NDK_APPLICATION_MK="$GITHUB_WORKSPACE/vendor/aml-psdk/Application.mk" \
            NDK_LIBS_OUT="$GITHUB_WORKSPACE/build/libs" \
            NDK_OUT="$GITHUB_WORKSPACE/build/obj" \
            NDK_DEBUG=0
      - name: Upload mod libraries
        uses: actions/upload-artifact@v4
        with:
          name: FreeLife-RP-GTA-SA-Android-Mod
          path: build/libs/**/*.so
          if-no-files-found: error
          retention-days: 14