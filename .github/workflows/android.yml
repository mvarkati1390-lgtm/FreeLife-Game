name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Export Android APK
        run: |
          mkdir -p build
          godot --headless --verbose --path . --export-debug "Android" build/ArSaCiA.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ArSaCiA-Android-APK
          path: build/ArSaCiA.apk
          if-no-files-found: error
          retention-days: 14
